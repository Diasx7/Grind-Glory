<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <!-- viewport-fit=cover é o que faz o env(safe-area-inset-bottom) da barra
         de abas funcionar de verdade no iphone com tela cheia -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Grind & Glory - suas tarefas da vida real viram um RPG" />
    <meta name="theme-color" content="#1b1330" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grind & Glory" />
    <title>Grind & Glory</title>
    <script>
      // aplica o tema salvo ANTES da primeira pintura da tela, senao da
      // pra ver um flash com o tema errado por uma fracao de segundo.
      // se nao tem nada salvo, nem mexe no atributo - af o CSS usa a
      // preferencia do sistema sozinho (ver src/temas.css)
      try {
        var temaSalvo = localStorage.getItem('tema')
        if (temaSalvo === 'claro' || temaSalvo === 'escuro') {
          document.documentElement.dataset.tema = temaSalvo
        }
      } catch (erro) {
        // localStorage bloqueado (modo privado etc) - segue com o tema do sistema
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
